name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      # One broken target should not hide the others.
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (musl)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: mitempr
            asset: mitempr-linux-x86_64-musl
            build: cargo

          # Pi Zero (ARMv6)
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            binary: mitempr
            asset: mitempr-linux-armv6-musl
            build: cross

          # Pi Zero 2 (ARM64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: mitempr
            asset: mitempr-linux-aarch64-musl
            build: cross

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Prebuilt binary — `cargo install cross` compiles from source and adds
      # minutes to every job.
      - name: Install cross
        if: matrix.build == 'cross'
        uses: taiki-e/install-action@cross

      - name: Install target
        if: matrix.build == 'cargo'
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          if [ "${{ matrix.build }}" = "cross" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      # No explicit strip step: [profile.release] already sets strip = true.

      - name: Rename binary and checksum it
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} \
             ${{ matrix.asset }}
          sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
