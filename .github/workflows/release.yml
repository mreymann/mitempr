name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          # Linux x86_64 (musl)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: mitempr
            asset: mitempr-linux-x86_64-musl
            build: cargo

          # Pi Zero (ARMv6)
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            binary: mitempr
            asset: mitempr-linux-armv6-musl
            build: cross

          # Pi Zero 2 (ARM64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: mitempr
            asset: mitempr-linux-aarch64-musl
            build: cross

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.build == 'cross'
        run: cargo install cross

      - name: Install target
        if: matrix.build == 'cargo'
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          if [ "${{ matrix.build }}" = "cross" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Rename binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} \
             ${{ matrix.asset }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
